.cd{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:4px 16px 14px;margin-bottom:14px}

.out{display:block;margin:20px auto;border:0;background:none;color:var(--mut)}

.nav-brand{display:none}

  m.innerHTML=`<div class="box" style="max-height:92vh;overflow:auto"><h2>Thời khóa biểu chính khóa</h2><p class="k">Nhập môn cho từng tiết. Các tiết liền nhau vẫn được lưu và tính riêng (ví dụ Tiết 1 + Tiết 2 = 2 tiết).</p><div class="seg">${TD.map(d=>`<button type="button" class="${d===day?'on':''}" data-day="${d}">${DOW[d]}</button>`).join('')}</div><datalist id="sj">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>${PS.map(([p])=>{const c=grid[day]?.[p]||{};return `<div class="tr2" data-p="${p}"><b>${pl(p)}</b><div class="tgi"><input class="ts" list="sj" placeholder="Môn" value="${esc(c.s||'')}"><input class="tt" placeholder="Giáo viên" value="${esc(c.t||'')}"></div></div>`}).join('')}<p class="k"><b>Thời gian từng tiết</b> · mỗi tiết 45 phút, dùng chung cho các ngày</p>${customTimes?`<p class="k">Đang tùy chỉnh riêng. Sửa giờ bắt đầu và kết thúc của từng tiết.</p>${PS.map(([p])=>`<div class="tp" data-p="${p}"><span>${pl(p)}</span><input type="time" value="${per[p]?.[0]||''}"><span>đến</span><input type="time" value="${per[p]?.[1]||''}"></div>`).join('')}`:`<label class="tp"><span>Buổi sáng bắt đầu</span><input id="startS" type="time" value="${autoStarts.S}"></label><label class="tp"><span>Buổi chiều bắt đầu</span><input id="startC" type="time" value="${autoStarts.C}"></label><p class="k">Các tiết tiếp theo tự tính nối tiếp, mỗi tiết 45 phút.</p>`}<button type="button" class="add" data-x="times">${customTimes?'Dùng giờ tự động (45 phút/tiết)':'Tùy chỉnh riêng từng tiết'}</button><div class="bt"><button type="button" data-x="cl">Xóa trắng</button><button type="button" data-x="no">Hủy</button><button type="button" class="p" data-x="ok">Áp dụng TKB mới</button></div></div>`};
