  m.innerHTML=`<div class="box" style="max-height:92vh;overflow:auto"><h2>Thời khóa biểu chính khóa</h2><p class="k">Nhập môn cho từng tiết. Các tiết liền nhau vẫn được lưu và tính riêng (ví dụ Tiết 1 + Tiết 2 = 2 tiết).</p><div class="seg">${TD.map(d=>`<button type="button" class="${d===day?'on':''}" data-day="${d}">${DOW[d]}</button>`).join('')}</div><datalist id="sj">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>${PS.map(([p])=>{const c=grid[day]?.[p]||{};return `<div class="tr2" data-p="${p}"><b>${pl(p)}</b><div class="tgi"><input class="ts" list="sj" placeholder="Môn" value="${esc(c.s||'')}"><input class="tt" placeholder="Giáo viên" value="${esc(c.t||'')}"></div></div>`}).join('')}<p class="k"><b>Giờ các tiết</b> (dùng chung cho cả tuần, sửa theo trường của bé)</p>${PS.map(([p])=>`<div class="tp" data-p="${p}"><span>${pl(p)}</span><input type="time" value="${per[p]?.[0]||''}"><span>đến</span><input type="time" value="${per[p]?.[1]||''}"></div>`).join('')}<div class="bt"><button type="button" data-x="cl">Xóa trắng</button><button type="button" data-x="no">Hủy</button><button type="button" class="p" data-x="ok">Áp dụng TKB mới</button></div></div>`};
 m.onchange=e=>{const t=e.target;if(t.classList.contains('ts')){const c=mine('courses').find(c=>c.type!=='extra'&&c.name.trim().toLowerCase()===t.value.trim().toLowerCase()),g=t.closest('.tr2').querySelector('.tt');if(c?.teacher&&!g.value)g.value=c.teacher}};
 m.onclick=async e=>{const t=e.target;if(t===m){m.remove();return}if(t.dataset.day){save();day=+t.dataset.day;paint()}else if(t.dataset.x==='no')m.remove();else if(t.dataset.x==='cl'){if(confirm('Xóa trắng toàn bộ thời khóa biểu đang nhập?')){Object.keys(grid).forEach(k=>delete grid[k]);paint()}}else if(t.dataset.x==='ok'){save();t.disabled=true;try{await tkbApply(grid,per);m.remove()}catch(x){alert(x.message);t.disabled=false}}};
 document.body.append(m);paint()}
function tkbForm(){ask('Tải ảnh thời khóa biểu',[{k:'files',l:'Chọn ảnh TKB (chụp hoặc chọn từ máy)',t:'file'},{k:'d',l:'Áp dụng từ ngày',t:'date',v:today()},{k:'note',l:'Ghi chú (VD: TKB học kỳ 2)'}],{},async v=>{if(!v.files.length)throw Error('Hãy chọn ảnh.');const img=await shrink(v.files[0],1600,.6);if(img.length>900000)throw Error('Ảnh quá nặng, hãy chụp lại hoặc chọn ảnh nhỏ hơn.');await add('tkbimgs',{studentId:sel,img,note:v.note||'',date:v.d})})}
const VIEW={home,lich,tkb,mon,tien,diem},NAV=[['home','Tổng quan'],['lich','Điểm danh'],['tkb','TKB'],['mon','Môn'],['tien','Tiền'],['diem','Điểm']];
const ageOf=d=>{if(!d)return '';const b=new Date(d+'T00:00'),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a>=0?a+' tuổi':''},sinfo=s=>[s.grade&&'Lớp '+s.grade,s.gender,ageOf(s.dob),s.school].filter(Boolean).join(' · ');
function render(){const A=$('#app');
 if(boot)return A.innerHTML='<p class="c">Đang tải…</p>';
 if(!user)return A.innerHTML=`<main class="c"><h1>KidTrack</h1><p>Lịch học, học phí và điểm số của các con.</p><button class="p" data-a="login">Đăng nhập bằng Google</button><p class="k">Thiết kế và sở hữu: Hà Việt Hùng</p></main>`;
 if(!sid)return A.innerHTML=`<main class="c"><h1>Tạo không gian chung</h1><p>Nhập email Google của người cùng quản lý để hai người xem và nhập chung một sổ.</p><button class="p" data-a="setup">Bắt đầu</button> <button data-a="out">Đăng xuất</button></main>`;
 const i=D.students.findIndex(s=>s.id===sel),st=D.students[i],home_=sel==='all'||!st;
 document.documentElement.style.setProperty('--c',home_?neu():col(i));document.body.dataset.role=isAdmin()?'admin':'viewer';
 const tabs=`<div class="tb"><button class="${home_?'on':''}" style="--c:${neu()}" data-a="stu" data-id="all">Family</button>${D.students.map((s,j)=>`<button class="${s.id===sel?'on':''}" style="--c:${col(j)}" data-a="stu" data-id="${s.id}">${esc(s.name)}</button>`).join('')}<button data-a="add" data-c="students" aria-label="Thêm học viên">+</button></div>`;
 const body=home_?all():VIEW[tab]();
 const sy=$('main')?.scrollTop||0;A.innerHTML=header()+`<main>${tabs}${body}</main>`+(`<nav>${NAV.map(n=>`<button class="${(home_?'home':tab)===n[0]?'on':''}" data-a="tab" data-id="${n[0]}">${svg(n[0])}${n[1]}</button>`).join('')}</nav>`);
 $('main').scrollTop=sy;afterRender();const a=$('#att');if(a)a.onchange=()=>{att=a.value||today();render()}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const {a,c,id,s}=b.dataset;if(['add','edit','del','pay','mark','extra','tkbadd','tkbedit','gcell','gqg','delstu','addc'].includes(a)&&!isAdmin())return alert('Bạn đang ở chế độ chỉ xem.');
 const F={...EXTRA(id),gcell:()=>gradeQuick(id,b.dataset.k),login:()=>signInWithPopup(auth,new GoogleAuthProvider(),browserPopupRedirectResolver),out:()=>signOut(auth),tab:()=>goTab(id),stu:()=>{if(sel!==id)closeFolds();sel=id;if(id!=='all')lastStu=id;render();scrollTo(0,0)},add:()=>form(c),edit:()=>form(c,id),pay:()=>payForm(id),img:()=>show(b.src),
 del:()=>confirm('Xóa mục này?')&&deleteDoc(ref(c,id)),
 mark:()=>{const d=b.dataset.d||att,k=id+'_'+d,cur=D.sessions.find(x=>x.id===k)?.status;return cur===s?deleteDoc(ref('sessions',k)):setDoc(ref('sessions',k),{studentId:sel,courseId:id,date:d,status:s,by:user.email,createdAt:serverTimestamp()})},
 extra:()=>{if(!mine('courses').length)return;ask('Ghi buổi học bù hoặc ngoài lịch',[{k:'c',l:'Môn',t:'select',o:mine('courses').filter(c=>c.type==='extra').map(x=>[x.id,x.name])},{k:'d',l:'Ngày',t:'date',v:today()},{k:'s',l:'Trạng thái',t:'select',o:[['makeup','Học bù (tính 1 buổi)'],['present','Đi học (buổi ngoài lịch)']]}],{},v=>{if(!v.d)throw Error('Cần chọn ngày.');return setDoc(ref('sessions',v.c+'_'+v.d),{studentId:sel,courseId:v.c,date:v.d,status:v.s,by:user.email,createdAt:serverTimestamp()})})},
 setup:()=>ask('Tạo không gian chung',[{k:'name',l:'Tên (VD: Gia đình Hùng)'},{k:'p',l:'Email Google của người được chia sẻ (chỉ xem), có thể bỏ trống',t:'email'}],{},async v=>{const a=[me()],w=[(v.p||'').trim().toLowerCase()].filter(x=>x&&x!==me()),o={name:v.name,admins:a,viewers:w,members:[...a,...w]},r=await addDoc(collection(db,'spaces'),{...o,createdAt:serverTimestamp()});sid=r.id;sp=o;listen();render()})};
 try{await F[a]?.()}catch(x){alert(x.message)}});
if(!boot)render();if(fromCache)listen();
</script></body></html>
