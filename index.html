<script type="module">

const app=initializeApp(FB),auth=initializeAuth(app,{persistence:[indexedDBLocalPersistence,browserLocalPersistence]});let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(app)}
try{navigator.storage?.persist?.()}catch(e){}
const APP_VER='1.5.1',APP_BUILD='15/11/2026 10:10';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=n=>{const d=String(n??'').replace(/\D/g,'');return d?(+d).toLocaleString('vi-VN'):''},vnd=n=>Math.round(n||0).toLocaleString('vi-VN')+' đ',today=()=>new Date().toLocaleDateString('sv'),fmtD=s=>s?s.split('-').reverse().join('/'):'';
const DOW=['CN','T2','T3','T4','T5','T6','T7'],COLS=['students','courses','sessions','fees','payments','grades','tkbimgs','tkbs'];
let user,sp={},sid,boot=true,tab='home',sel='all',att=today();const D={};COLS.forEach(c=>D[c]=[]);
const ref=(c,id)=>doc(db,'spaces',sid,c,id),mine=c=>D[c].filter(x=>x.studentId===sel);
const add=(c,o)=>addDoc(collection(db,'spaces',sid,c),{...o,createdAt:serverTimestamp(),by:user.email});
function listen(){COLS.forEach(c=>onSnapshot(collection(db,'spaces',sid,c),s=>{D[c]=s.docs.map(d=>({id:d.id,...d.data()}));LOADED[c]=1;saveCache();if(c==='students'&&sel!=='all'&&!D.students.some(x=>x.id===sel))sel='all';render()}))}
const CK='kt_cache';let fromCache=false,cachedEmail='',cacheT=0;
function saveCache(){clearTimeout(cacheT);cacheT=setTimeout(()=>{try{if(!sid||!user)return;const d={};COLS.forEach(c=>d[c]=D[c].map(x=>{const y={...x};delete y.imgs;delete y.img;y.createdAt=x.createdAt?.seconds?{seconds:x.createdAt.seconds}:undefined;return y}));localStorage.setItem(CK,JSON.stringify({sid,sp,u:{email:user.email,displayName:user.displayName||''},D:d}))}catch(e){}},1500)}
try{const c=JSON.parse(localStorage.getItem(CK)||'null');if(c&&c.sid&&c.u&&c.u.email){user=c.u;sid=c.sid;sp=c.sp||{};COLS.forEach(k=>D[k]=c.D[k]||[]);boot=false;fromCache=true;cachedEmail=c.u.email.toLowerCase()}}catch(e){}

 if(u&&fromCache&&u.email.toLowerCase()===cachedEmail){user=u;fromCache=false;watchSpace();render();return}

 if(u){const q=await getDocs(query(collection(db,'spaces'),where('members','array-contains',u.email.toLowerCase())));if(!q.empty){sid=q.docs[0].id;sp=q.docs[0].data();listen();watchSpace()}}render()});

/* ---- tính toán ---- */
const sched=c=>(c.days||'').split(',').map(t=>t.trim().match(/^(CN|T([2-7]))\s*(.*)$/i)).filter(Boolean).map(m=>({d:/cn/i.test(m[1])?0:+m[2]-1,t:m[3]}));

const paid=id=>D.payments.filter(p=>p.refId===id).reduce((a,p)=>a+(+p.amount||0),0);
const dues=()=>[...mine('fees').map(f=>({id:f.id,name:f.name,due:+f.amount||0,sub:f.due?'Hạn '+fmtD(f.due):f.note||'Khoản thu'})),
 ...mine('courses').filter(c=>c.billing&&c.billing!=='none').map(c=>{const y=cyc(c);return {id:c.id,name:c.name,due:owed(c),sub:c.billing==='session'?`${attN(c)} buổi${c.finalSessions!==''&&c.finalSessions!=null?' (cô chốt)':' (điểm danh)'} × ${vnd(c.rate)}`:y?`Khóa ${y.done+1}: ${y.cur}/${y.S} buổi · tạm tính ${vnd(y.cur*y.unit)} / ${vnd(y.P)}${y.cur>0&&y.S-y.cur<=3?' · sắp hết khóa':''}${y.done?' · đã đủ '+y.done+' khóa':''}`:'Trọn khóa'}})].map(i=>({...i,paid:paid(i.id)}));

const wa=(f,vals)=>f.w?` data-w="${f.w}"${(vals.type||'extra')!==f.w?' hidden':''}`:'';

const slotsHtml=(f,vals)=>{const p=(h,m)=>h?h.padStart(2,'0')+':'+m:'',L=sched({days:vals[f.k]||''}).map(x=>{const m=(x.t||'').match(/(\d{1,2}):(\d{2})(?:\s*-\s*(\d{1,2}):(\d{2}))?/);return slotRow(x.d,m?p(m[1],m[2]):'',m&&m[3]?p(m[3],m[4]):'')});return `<p class="k" style="margin-bottom:0">${f.l}</p><div class="slw">${(L.length?L:[slotRow(1)]).join('')}</div><button type="button" class="add" data-addslot>+ Thêm buổi trong tuần</button>`};

 const im=mine('tkbimgs').sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map((x,i)=>`<div class="r"><div><b>${i?'Bản cũ':'Bản mới nhất'} · áp dụng từ ${fmtD(x.date)}</b>${x.note?`<small>${esc(x.note)}</small>`:''}<div class="th"><img src="${x.img}" data-a="img" alt="Thời khóa biểu" style="width:128px;height:96px"></div></div><div class="am">${btn('del','tkbimgs',x.id,'Xóa')}</div></div>`).join('');
 return card('Thời khóa biểu chính khóa (T2–T6)'+(t?' · từ '+fmtD(t.from):''),tkbTable(t)+addb(t?'Tạo TKB mới / sửa TKB':'Tạo thời khóa biểu','tkbedit',''))+card('Lịch học thêm trong tuần',ex||empty('Chưa có lịch học thêm.'))+card('Ảnh thời khóa biểu',(im||empty('Chưa có ảnh. Khi nhà trường đổi TKB, chụp ảnh tải lên đây để lưu lại, rồi tạo TKB mới ở trên.'))+addb('Tải ảnh thời khóa biểu mới','tkbadd',''))}
async function tkbApply(grid,per){const subj={};
 TD.forEach(d=>{let prev=null;PS.map(([p])=>({p,c:grid[d]?.[p]})).filter(x=>x.c&&x.c.s).forEach(x=>{const [a,b]=per[x.p]||['',''],k=x.c.s.trim().toLowerCase(),o=subj[k]??={name:x.c.s.trim(),t:'',slots:[]};if(x.c.t&&!o.t)o.t=x.c.t.trim();
  if(prev&&prev.k===k&&prev.p[0]===x.p[0]&&+prev.p[1]+1===+x.p[1]){prev.slot.b=b;prev.p=x.p}else{const slot={d,a,b};o.slots.push(slot);prev={k,p:x.p,slot}}})});
 const days=sl=>sl.filter(s=>s.a).map(s=>'T'+(s.d+1)+' '+s.a+(s.b?'-'+s.b:'')).join(', '),mains=mine('courses').filter(c=>c.type!=='extra'),used=new Set();
 for(const k in subj){const o=subj[k],ex=mains.find(c=>c.name.trim().toLowerCase()===k),data={days:days(o.slots),teacher:o.t||ex?.teacher||'',type:'main',billing:'none'};if(ex){used.add(ex.id);await updateDoc(ref('courses',ex.id),data)}else await add('courses',{...data,name:o.name,studentId:sel})}
 for(const c of mains)if(!used.has(c.id)&&c.days)await updateDoc(ref('courses',c.id),{days:''});
 await add('tkbs',{studentId:sel,from:today(),per,grid})}
function tkbEdit(){const cur=latestTkb(),per=JSON.parse(JSON.stringify(cur?.per||PT)),grid=JSON.parse(JSON.stringify(cur?.grid||{}));let day=1;const m=document.createElement('div');m.className='md';m.id='tke';
 const save=()=>{m.querySelectorAll('.tr2').forEach(r=>{const p=r.dataset.p,s=r.querySelector('.ts').value.trim(),t=r.querySelector('.tt').value.trim();if(s||t)(grid[day]??={})[p]={s,t};else if(grid[day])delete grid[day][p]});m.querySelectorAll('.tp').forEach(r=>{const i=r.querySelectorAll('input');per[r.dataset.p]=[i[0].value,i[1].value]})};
 const paint=()=>{const names=[...new Set(mine('courses').filter(c=>c.type!=='extra').map(c=>c.name))];
  m.innerHTML=`<div class="box" style="max-height:92vh;overflow:auto"><h2>Thời khóa biểu chính khóa</h2><p class="k">Chọn thứ rồi nhập môn và giáo viên bộ môn cho từng tiết, tiết không học thì để trống. Hai tiết liền nhau cùng môn sẽ gộp thành một buổi.</p><div class="seg">${TD.map(d=>`<button type="button" class="${d===day?'on':''}" data-day="${d}">${DOW[d]}</button>`).join('')}</div><datalist id="sj">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>${PS.map(([p])=>{const c=grid[day]?.[p]||{};return `<div class="tr2" data-p="${p}"><b>${pl(p)}</b><div class="tgi"><input class="ts" list="sj" placeholder="Môn" value="${esc(c.s||'')}"><input class="tt" placeholder="Giáo viên" value="${esc(c.t||'')}"></div></div>`}).join('')}<p class="k"><b>Giờ các tiết</b> (dùng chung cho cả tuần, sửa theo trường của bé)</p>${PS.map(([p])=>`<div class="tp" data-p="${p}"><span>${pl(p)}</span><input type="time" value="${per[p]?.[0]||''}"><span>đến</span><input type="time" value="${per[p]?.[1]||''}"></div>`).join('')}<div class="bt"><button type="button" data-x="cl">Xóa trắng</button><button type="button" data-x="no">Hủy</button><button type="button" class="p" data-x="ok">Áp dụng TKB mới</button></div></div>`};
 m.onchange=e=>{const t=e.target;if(t.classList.contains('ts')){const c=mine('courses').find(c=>c.type!=='extra'&&c.name.trim().toLowerCase()===t.value.trim().toLowerCase()),g=t.closest('.tr2').querySelector('.tt');if(c?.teacher&&!g.value)g.value=c.teacher}};
 m.onclick=async e=>{const t=e.target;if(t===m){m.remove();return}if(t.dataset.day){save();day=+t.dataset.day;paint()}else if(t.dataset.x==='no')m.remove();else if(t.dataset.x==='cl'){if(confirm('Xóa trắng toàn bộ thời khóa biểu đang nhập?')){Object.keys(grid).forEach(k=>delete grid[k]);paint()}}else if(t.dataset.x==='ok'){save();t.disabled=true;try{await tkbApply(grid,per);m.remove()}catch(x){alert(x.message);t.disabled=false}}};
 document.body.append(m);paint()}
function tkbForm(){ask('Tải ảnh thời khóa biểu',[{k:'files',l:'Chọn ảnh TKB (chụp hoặc chọn từ máy)',t:'file'},{k:'d',l:'Áp dụng từ ngày',t:'date',v:today()},{k:'note',l:'Ghi chú (VD: TKB học kỳ 2)'}],{},async v=>{if(!v.files.length)throw Error('Hãy chọn ảnh.');const img=await shrink(v.files[0],1600,.6);if(img.length>900000)throw Error('Ảnh quá nặng, hãy chụp lại hoặc chọn ảnh nhỏ hơn.');await add('tkbimgs',{studentId:sel,img,note:v.note||'',date:v.d})})}

function render(){const A=$('#app');
 if(boot)return A.innerHTML='<p class="c">Đang tải…</p>';

 if(!sid)return A.innerHTML=`<main class="c"><h1>Tạo không gian chung</h1><p>Nhập email Google của người cùng quản lý để hai người xem và nhập chung một sổ.</p><button class="p" data-a="setup">Bắt đầu</button> <button data-a="out">Đăng xuất</button></main>`;
 const i=D.students.findIndex(s=>s.id===sel),st=D.students[i],home_=sel==='all'||!st;
 document.documentElement.style.setProperty('--c',home_?neu():col(i));document.body.dataset.role=isAdmin()?'admin':'viewer';

 const sy=$('main')?.scrollTop||0;A.innerHTML=header()+`<main>${tabs}${body}</main>`+(`<nav>${NAV.map(n=>`<button class="${(home_?'home':tab)===n[0]?'on':''}" data-a="tab" data-id="${n[0]}">${svg(n[0])}${n[1]}</button>`).join('')}</nav>`);
 $('main').scrollTop=sy;afterRender();const a=$('#att');if(a)a.onchange=()=>{att=a.value||today();render()}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const {a,c,id,s}=b.dataset;if(['add','edit','del','pay','mark','extra','tkbadd','tkbedit'].includes(a)&&!isAdmin())return alert('Bạn đang ở chế độ chỉ xem.');
 const F={...EXTRA(id),login:()=>signInWithPopup(auth,new GoogleAuthProvider(),browserPopupRedirectResolver),out:()=>signOut(auth),tab:()=>{if(sel==='all'&&id!=='home'){const p=D.students.some(x=>x.id===lastStu)?lastStu:D.students[0]?.id;if(!p)return alert('Hãy thêm học viên trước.');sel=p}tab=id;render()},stu:()=>{sel=id;if(id!=='all')lastStu=id;render();scrollTo(0,0)},add:()=>form(c),edit:()=>form(c,id),pay:()=>payForm(id),img:()=>show(b.src),
 del:()=>confirm('Xóa mục này?')&&deleteDoc(ref(c,id)),
 mark:()=>{const d=b.dataset.d||att,k=id+'_'+d,cur=D.sessions.find(x=>x.id===k)?.status;return cur===s?deleteDoc(ref('sessions',k)):setDoc(ref('sessions',k),{studentId:sel,courseId:id,date:d,status:s,by:user.email,createdAt:serverTimestamp()})},
 extra:()=>{if(!mine('courses').length)return;ask('Ghi buổi học bù hoặc ngoài lịch',[{k:'c',l:'Môn',t:'select',o:mine('courses').filter(c=>c.type==='extra').map(x=>[x.id,x.name])},{k:'d',l:'Ngày',t:'date',v:today()},{k:'s',l:'Trạng thái',t:'select',o:[['makeup','Học bù (tính 1 buổi)'],['present','Đi học (buổi ngoài lịch)']]}],{},v=>{if(!v.d)throw Error('Cần chọn ngày.');return setDoc(ref('sessions',v.c+'_'+v.d),{studentId:sel,courseId:v.c,date:v.d,status:v.s,by:user.email,createdAt:serverTimestamp()})})},
 setup:()=>ask('Tạo không gian chung',[{k:'name',l:'Tên (VD: Gia đình Hùng)'},{k:'p',l:'Email Google của người được chia sẻ (chỉ xem), có thể bỏ trống',t:'email'}],{},async v=>{const a=[me()],w=[(v.p||'').trim().toLowerCase()].filter(x=>x&&x!==me()),o={name:v.name,admins:a,viewers:w,members:[...a,...w]},r=await addDoc(collection(db,'spaces'),{...o,createdAt:serverTimestamp()});sid=r.id;sp=o;listen();render()})};
