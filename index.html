<!doctype html>
<html lang="vi"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4F3;--ink:#16252C;--mut:#60737B;--ln:#E1E8E6;--c:#0E5A68;--card:#fff;--warn:#9A5B05;--ok:#256B43}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:auto;padding:0 14px 100px}
.c{text-align:center;padding:64px 20px}.c h1{font-size:28px;margin:0 0 8px}
button{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.p{background:var(--c);color:#fff;border-color:var(--c);font-weight:500}
.tb{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;background:var(--bg);padding:10px 0 8px;margin-bottom:6px}
.tb button{border-radius:99px;padding:8px 18px;color:var(--mut);white-space:nowrap;font-weight:500}
.tb button.on{background:var(--c);border-color:var(--c);color:#fff}
.hero{background:var(--c);color:#fff;border-radius:18px;padding:18px 20px;margin:4px 0 14px}
.hero small{font-size:15px;font-weight:500}.hero p{margin:12px 0 0;opacity:.8;font-size:13px}
.hero strong{display:block;font-size:34px;line-height:1.2;font-variant-numeric:tabular-nums}
.cd{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:4px 16px 14px;margin-bottom:14px}
.cd h2{font-size:14px;margin:14px 0 2px;color:var(--mut);font-weight:500}
.r{display:flex;justify-content:space-between;gap:12px;padding:12px 0}.r+.r{border-top:1px solid var(--ln)}
.r b{font-weight:500}.r small{display:block;color:var(--mut);font-size:13px}
.am{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.am button{padding:4px 12px;font-size:13px;margin:6px 0 0 6px;font-weight:400}
.pill{display:inline-block;font-size:12px;border-radius:99px;padding:1px 10px}
.pill.w{background:#FBEBD0;color:var(--warn)}.pill.o{background:#DCEFE3;color:var(--ok)}
.seg{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.seg button{padding:6px 14px}
.seg button.on{background:var(--c);color:#fff;border-color:var(--c)}
.th{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.th img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--ln)}
.sc{display:block;width:100%;text-align:left;border:0;border-radius:18px;background:var(--c);color:#fff;padding:16px 20px;margin-bottom:12px}
.sc b{font-size:18px;display:block}.sc span{opacity:.8;font-size:13px;display:block;margin-top:10px}
.sc strong{font-size:28px;display:block;font-variant-numeric:tabular-nums}.sc small{opacity:.85}
.add{display:block;width:100%;margin-top:10px;background:color-mix(in srgb,var(--c) 10%,var(--card));color:var(--c);border:0;font-weight:500}
.k{color:var(--mut);font-size:13px;margin:12px 0 6px}
.dt{font:inherit;padding:6px 8px;border:1px solid var(--ln);border-radius:8px;margin-left:6px;color:var(--ink)}
.out{display:block;margin:20px auto;border:0;background:none;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mut);padding:9px 2px 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--c);font-weight:700}
.md{position:fixed;inset:0;background:#16252Caa;display:flex;align-items:flex-end;justify-content:center;z-index:9;overflow:auto}
.md form,.md .box{background:var(--card);width:100%;max-width:520px;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0));border-radius:18px 18px 0 0}
.md label{display:block;margin:12px 0 0;font-size:13px;color:var(--mut)}
.md input,.md select{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--ln);border-radius:10px;margin-top:4px;color:var(--ink);background:var(--card)}
.md h2{margin:0;font-size:18px}.bt{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.md img{max-width:100%;border-radius:10px}
html[data-skin=night]{--bg:#0F1420;--card:#18202F;--ink:#E8EDF6;--mut:#93A0B5;--ln:#28324A;--warn:#E0A44A;--ok:#4CD08A}
html[data-skin=sunset]{--bg:#FBF3EC;--ink:#2E211C;--mut:#8A6F63;--ln:#EBD9CC}
html[data-skin=forest]{--bg:#EDF3EC;--ink:#1D2A1F;--mut:#5E7261;--ln:#D3E0D2}
html[data-skin=night] .pill.w{background:#3A2E18}html[data-skin=night] .pill.o{background:#173626}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{flex:0 0 auto;background:var(--bg);border-bottom:1px solid var(--ln);padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px}
#hb{max-width:640px;margin:0 auto;display:flex;align-items:baseline;gap:10px}
#tm{font-size:20px;font-variant-numeric:tabular-nums}#dt{font-size:12px;color:var(--mut);margin-left:6px}
.wx{margin-left:auto;font-size:14px;font-weight:500;white-space:nowrap}
#gear{border:0;background:none;padding:0 4px;font-size:18px}
header h1{max-width:640px;margin:4px auto 0;font-size:19px}
header .sub{max-width:640px;margin:2px auto 0;color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;zoom:var(--z,1);width:100%}
nav{transition:transform .35s ease}nav.hide{transform:translateY(105%)}
.dt{background:var(--card)}

.am button.on{background:var(--c);color:#fff;border-color:var(--c)}.am button.no.on{background:#B3261E;border-color:#B3261E}
.pill:not(.w):not(.o){background:var(--ln)}
body[data-role=viewer] :is([data-a=add],[data-a=edit],[data-a=del],[data-a=pay],[data-a=extra]){display:none}
body[data-role=viewer] [data-a=mark]{pointer-events:none}body[data-role=viewer] [data-a=mark]:not(.on){opacity:.35}
.md .sl{display:flex;gap:6px;align-items:center;margin-top:8px}.md .sl select{flex:1.3;width:auto;margin:0}.md .sl input{flex:1;width:auto;min-width:0;margin:0}.md .sl span{color:var(--mut);font-size:13px}.md .sl .x{padding:6px 11px;font-size:18px;line-height:1}
</style></head><body><div id="app"></div>
<script type="module">
/* ==== DÁN CẤU HÌNH FIREBASE CỦA ANH VÀO ĐÂY (Project settings > Your apps > Web) ==== */
const FB=window.KT_FB||{};
if(!FB.apiKey){document.getElementById("app").innerHTML='<main class="c"><h1>KidTrack</h1><p>Chưa có cấu hình Firebase. Hãy điền file firebase-config.js rồi tải lên cùng index.html.</p></main>';throw new Error("Thiếu firebase-config.js")}
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,setPersistence,browserLocalPersistence,indexedDBLocalPersistence} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,onSnapshot,query,where,getDocs,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp(FB),auth=getAuth(app),db=getFirestore(app);
setPersistence(auth,indexedDBLocalPersistence).catch(()=>setPersistence(auth,browserLocalPersistence)).catch(()=>{});try{navigator.storage?.persist?.()}catch(e){}
const APP_VER='1.2.1',APP_BUILD='14/11/2026 15:23';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=n=>{const d=String(n??'').replace(/\D/g,'');return d?(+d).toLocaleString('vi-VN'):''},vnd=n=>Math.round(n||0).toLocaleString('vi-VN')+' đ',today=()=>new Date().toLocaleDateString('sv'),fmtD=s=>s?s.split('-').reverse().join('/'):'';
const DOW=['CN','T2','T3','T4','T5','T6','T7'],COLS=['students','courses','sessions','fees','payments','grades'];
let user,sp={},sid,boot=true,tab='home',sel='all',att=today();const D={};COLS.forEach(c=>D[c]=[]);
const ref=(c,id)=>doc(db,'spaces',sid,c,id),mine=c=>D[c].filter(x=>x.studentId===sel);
const add=(c,o)=>addDoc(collection(db,'spaces',sid,c),{...o,createdAt:serverTimestamp(),by:user.email});
function listen(){COLS.forEach(c=>onSnapshot(collection(db,'spaces',sid,c),s=>{D[c]=s.docs.map(d=>({id:d.id,...d.data()}));LOADED[c]=1;if(c==='students'&&sel!=='all'&&!D.students.some(x=>x.id===sel))sel='all';render()}))}
onAuthStateChanged(auth,async u=>{user=u;boot=false;sid=null;if(u){const q=await getDocs(query(collection(db,'spaces'),where('members','array-contains',u.email.toLowerCase())));if(!q.empty){sid=q.docs[0].id;sp=q.docs[0].data();listen()}}render()});

/* ---- tính toán ---- */
const sched=c=>(c.days||'').split(',').map(t=>t.trim().match(/^(CN|T([2-7]))\s*(.*)$/i)).filter(Boolean).map(m=>({d:/cn/i.test(m[1])?0:+m[2]-1,t:m[3]}));
const nSess=c=>D.sessions.filter(s=>s.courseId===c.id&&inR(c,s.date)&&s.status!=='absent').length;
const owed=c=>c.billing==='course'?+c.price||0:c.billing==='session'?((c.finalSessions!==''&&c.finalSessions!=null?+c.finalSessions:nSess(c))*(+c.rate||0)):0;
const paid=id=>D.payments.filter(p=>p.refId===id).reduce((a,p)=>a+(+p.amount||0),0);
const dues=()=>[...mine('fees').map(f=>({id:f.id,name:f.name,due:+f.amount||0,sub:f.due?'Hạn '+fmtD(f.due):f.note||'Khoản thu'})),
 ...mine('courses').filter(c=>c.billing&&c.billing!=='none').map(c=>({id:c.id,name:c.name,due:owed(c),sub:c.billing==='session'?`${c.finalSessions!==''&&c.finalSessions!=null?c.finalSessions+' buổi (cô chốt)':nSess(c)+' buổi (điểm danh)'} × ${vnd(c.rate)}`:'Trọn khóa'}))].map(i=>({...i,paid:paid(i.id)}));

/* ---- form chung ---- */
const slotRow=(d=1,a='',b='')=>`<div class="sl"><select>${[1,2,3,4,5,6,0].map(x=>`<option value="${x}"${+d===x?' selected':''}>${x?'Thứ '+(x+1):'Chủ nhật'}</option>`).join('')}</select><input type="time" value="${a}" aria-label="Giờ bắt đầu"><span>đến</span><input type="time" value="${b}" aria-label="Giờ kết thúc"><button type="button" class="x" data-rm aria-label="Xóa buổi">×</button></div>`;
const slotsHtml=(f,vals)=>{const p=(h,m)=>h?h.padStart(2,'0')+':'+m:'',L=sched({days:vals[f.k]||''}).map(x=>{const m=(x.t||'').match(/(\d{1,2}):(\d{2})(?:\s*-\s*(\d{1,2}):(\d{2}))?/);return slotRow(x.d,m?p(m[1],m[2]):'',m&&m[3]?p(m[3],m[4]):'')});return `<p class="k" style="margin-bottom:0">${f.l}</p><div class="slw">${(L.length?L:[slotRow(1)]).join('')}</div><button type="button" class="add" data-addslot>+ Thêm buổi trong tuần</button>`};
const slotStr=f=>[...f.querySelectorAll('.sl')].map(r=>{const x=+r.querySelector('select').value,[a,b]=[...r.querySelectorAll('input')].map(i=>i.value);return (x?'T'+(x+1):'CN')+(a?' '+a+(b?'-'+b:''):'')}).join(', ');
function ask(title,fs,vals,cb){const m=document.createElement('div');m.className='md';
 m.innerHTML=`<form><h2>${esc(title)}</h2>${fs.map(f=>f.t==='sched'?slotsHtml(f,vals):`<label>${f.l}${f.t==='select'?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==(vals[f.k]??f.v??'')?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:f.t==='money'?`<input name="${f.k}" data-m="1" inputmode="numeric" autocomplete="off" value="${fm(vals[f.k]??f.v??'')}">`:f.t==='file'?`<input name="${f.k}" type="file" accept="image/*" multiple>`:`<input name="${f.k}" type="${f.t||'text'}" ${f.t==='number'?'inputmode="decimal" step="any"':''} value="${esc(vals[f.k]??f.v??'')}">`}</label>`).join('')}<div class="bt"><button type="button" class="g">Hủy</button><button class="p">Lưu</button></div></form>`;
 document.body.append(m);m.addEventListener('input',e=>{if(e.target.dataset.m)e.target.value=fm(e.target.value)});m.addEventListener('click',e=>{const t=e.target;if(t.dataset.addslot!=null){const w=t.previousElementSibling,l=w.lastElementChild;if(!l)return w.insertAdjacentHTML('beforeend',slotRow(1));const d=+l.querySelector('select').value,[a,b]=[...l.querySelectorAll('input')].map(i=>i.value);w.insertAdjacentHTML('beforeend',slotRow(d===6?0:d===0?1:d+1,a,b))}else if(t.dataset.rm!=null)t.closest('.sl').remove()});m.querySelector('.g').onclick=()=>m.remove();
 m.querySelector('form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),v={};fs.forEach(f=>v[f.k]=f.t==='sched'?slotStr(e.target):f.t==='money'?(fm(fd.get(f.k))===''?'':+String(fd.get(f.k)).replace(/\D/g,'')):f.t==='file'?fd.getAll(f.k).filter(x=>x.size):f.t==='number'&&fd.get(f.k)!==''?+fd.get(f.k):fd.get(f.k));const b=e.target.querySelector('.p');b.disabled=true;try{await cb(v);m.remove()}catch(x){alert(x.message);b.disabled=false}}}
const FIELDS={
 students:()=>[{k:'name',l:'Tên học viên'}],
 courses:()=>[{k:'name',l:'Tên môn'},{k:'type',l:'Loại',t:'select',o:[['main','Học chính'],['extra','Học thêm']]},{k:'billing',l:'Cách tính tiền',t:'select',o:[['none','Không tính tiền'],['course','Theo khóa'],['session','Theo buổi']]},{k:'price',l:'Giá trọn khóa (đ)',t:'money'},{k:'rate',l:'Giá mỗi buổi (đ)',t:'money'},{k:'finalSessions',l:'Số buổi cô chốt cuối khóa (để trống nếu chưa có)',t:'number'},{k:'start',l:'Ngày bắt đầu khóa (đếm buổi từ ngày này)',t:'date'},{k:'end',l:'Ngày kết thúc khóa (nếu có)',t:'date'},{k:'days',l:'Lịch học trong tuần (chọn thứ, giờ bắt đầu, giờ kết thúc)',t:'sched'}],
 fees:()=>[{k:'name',l:'Tên khoản (học phí, CSVC, quỹ lớp…)'},{k:'amount',l:'Số tiền (đ)',t:'money'},{k:'due',l:'Hạn nộp (có thể bỏ trống)',t:'date'},{k:'note',l:'Ghi chú'}],
 grades:()=>[{k:'courseId',l:'Môn',t:'select',o:mine('courses').map(c=>[c.id,c.name])},{k:'kind',l:'Loại bài (miệng, 15 phút, giữa kỳ…)'},{k:'score',l:'Điểm',t:'number'},{k:'max',l:'Thang điểm',t:'number',v:10},{k:'date',l:'Ngày',t:'date',v:today()},{k:'note',l:'Ghi chú'}]};
const TITLE={students:'học viên',courses:'môn học',fees:'khoản thu',grades:'điểm'};
function form(c,id){if(c!=='students'&&sel==='all')return alert('Hãy chọn một học viên trước.');if(c==='grades'&&!mine('courses').length)return alert('Hãy thêm môn học trước.');
 const cur=id?D[c].find(x=>x.id===id):{};ask((id?'Sửa ':'Thêm ')+TITLE[c],FIELDS[c](),cur,async v=>{if(!v.name&&c!=='grades')throw Error('Cần nhập tên.');if(id)await updateDoc(ref(c,id),v);else await add(c,c==='students'?v:{...v,studentId:sel})})}
const shrink=f=>new Promise((ok,no)=>{const i=new Image();i.onerror=()=>no(Error('Không đọc được ảnh.'));i.onload=()=>{const k=Math.min(1,1100/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.55))};i.src=URL.createObjectURL(f)});
function payForm(rid){const its=dues(),it=its.find(i=>i.id===rid);
 ask('Ghi đóng tiền',[{k:'refId',l:'Khoản',t:'select',o:[...its.map(i=>[i.id,i.name]),['','Khoản khác']]},{k:'label',l:'Tên khoản nếu chọn "Khoản khác"'},{k:'amount',l:'Số tiền đã đóng (đ)',t:'money'},{k:'paidDate',l:'Ngày đóng',t:'date'},{k:'note',l:'Ghi chú'},{k:'files',l:'Chứng từ: ảnh hóa đơn, biên lai, phiếu thu (tối đa 4)',t:'file'}],
 {refId:rid||'',amount:it?Math.max(0,it.due-it.paid):'',paidDate:today()},async v=>{if(!(v.amount>0))throw Error('Cần nhập số tiền.');const imgs=[];for(const f of v.files.slice(0,4))imgs.push(await shrink(f));if(imgs.join('').length>900000)throw Error('Ảnh quá nặng, hãy chọn ít ảnh hơn.');
 const x=its.find(i=>i.id===v.refId);await add('payments',{studentId:sel,refId:v.refId,label:x?x.name:v.label||'Khoản khác',amount:v.amount,paidDate:v.paidDate,note:v.note,imgs})})}
const show=src=>{const m=document.createElement('div');m.className='md';m.innerHTML=`<div class="box"><img src="${src}"><div class="bt"><button class="g">Đóng</button></div></div>`;document.body.append(m);m.onclick=e=>{if(e.target===m||e.target.closest('.g'))m.remove()}};

/* ---- tùy chỉnh: chủ đề, thu phóng, tiêu đề, thông báo đẩy ---- */
const PURL=()=>String(window.STUDY_PUSH_URL||'').trim().replace(/\/+$/,'');
const SK={ocean:['Xanh ngọc',['#0E5A68','#B4492F','#5A4FB0','#2F7D4F','#A5640A'],'#16252C','#0E5A68'],
 night:['Đêm',['#2B8A9C','#D9694A','#7A6BE0','#3FA56E','#C58A1F'],'#3B4A68','#0F1420'],
 sunset:['Hoàng hôn',['#C2542D','#A63A6B','#2F6F8F','#6B7F2A','#B8860B'],'#2E211C','#FBF3EC'],
 forest:['Rừng',['#2F7D4F','#7A5A2B','#2D6A8A','#8A4F7D','#B26A1B'],'#1D2A1F','#EDF3EC']};
const LV=[75,85,100,125,150,175],LOADED={};
const skin=()=>SK[document.documentElement.dataset.skin]?document.documentElement.dataset.skin:'ocean',neu=()=>SK[skin()][2];
const setSkin=k=>{document.documentElement.dataset.skin=k;try{localStorage.setItem('kt_skin',k)}catch(e){}document.querySelector('meta[name=theme-color]').content=SK[k][3]};
let Z=100;const setZ=v=>{Z=v;document.documentElement.style.setProperty('--z',v/100);try{localStorage.setItem('kt_z',v)}catch(e){}};
try{const z0=+localStorage.getItem('kt_z');setZ(LV.includes(z0)?z0:100)}catch(e){}
setSkin(skin());
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
/* giờ, ngày, lời chào, thời tiết */
const DN=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'],WXI=c=>c===0?'☀️':c<3?'🌤️':c===3?'☁️':c<50?'🌫️':c<70?'🌧️':c>=95?'⛈️':c>=80?'🌦️':'☁️';
